services:
  db:
    image: postgres:17-alpine
    container_name: sulwork-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eventos}
      POSTGRES_USER: ${DB_USER:-eventos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventos}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
