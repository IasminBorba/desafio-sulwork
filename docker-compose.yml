services:
  db:
    image: postgres:17-alpine
    container_name: sulwork-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eventos}
      POSTGRES_USER: ${DB_USER:-eventos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventos}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: sulwork-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-eventos}
      DB_USER: ${DB_USER:-eventos}
      DB_PASSWORD: ${DB_PASSWORD:-eventos}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-com-pelo-menos-trinta-e-dois-chars!!}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-8h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost,http://localhost:80}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: sulwork-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  db-data:
