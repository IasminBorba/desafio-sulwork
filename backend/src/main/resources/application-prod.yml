spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://desafio-sulwork-omega.vercel.app}
  jwt:
    secret: ${JWT_SECRET}
