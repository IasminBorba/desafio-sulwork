spring:
  application:
    name: eventos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/eventos}
    username: ${DB_USER:eventos}
    password: ${DB_PASSWORD:eventos}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

app:
  timezone: America/Recife
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
